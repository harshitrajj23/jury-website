<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="palsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="palsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-tech Emblem Hexagon -->
  <g transform="translate(15, 10)">
    <!-- Outer Hex Shield -->
    <polygon points="40,2 75,22 75,62 40,82 5,62 5,22" 
             stroke="url(#palsCyan)" stroke-width="2.5" fill="#090d16" filter="url(#cyanGlow)" />
    
    <!-- Inner Accent Nodes -->
    <circle cx="40" cy="2" r="3" fill="#06b6d4" />
    <circle cx="75" cy="22" r="3" fill="#06b6d4" />
    <circle cx="75" cy="62" r="3" fill="#06b6d4" />
    <circle cx="40" cy="82" r="3" fill="#06b6d4" />
    <circle cx="5" cy="62" r="3" fill="#06b6d4" />
    <circle cx="5" cy="22" r="3" fill="#06b6d4" />
    
    <!-- Torch Flame / Leadership Wings Motif -->
    <path d="M40,18 C46,28 54,34 50,52 C47,65 33,65 30,52 C26,34 34,28 40,18 Z" 
          fill="url(#palsCyan)" opacity="0.9" />
    <path d="M40,28 C43,35 48,39 46,50 C44,57 36,57 34,50 C32,39 37,35 40,28 Z" 
          fill="url(#palsGold)" />
    <circle cx="40" cy="52" r="3" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <!-- Main "PALS" Acronym -->
  <text x="110" y="54" font-family="'Orbitron', -apple-system, sans-serif" font-weight="900" font-size="38" 
        letter-spacing="5" fill="#ffffff">
    PALS
  </text>
  
  <!-- Glowing Acronym Dot / Highlight -->
  <rect x="255" y="27" width="6" height="28" fill="url(#palsCyan)" />

  <!-- Subtitle Tagline -->
  <text x="112" y="72" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" 
        letter-spacing="3" fill="#06b6d4">
    PAN IIT ALUMNI LEADERSHIP SERIES
  </text>

  <!-- Cyber Sub-bar -->
  <line x1="112" y1="80" x2="385" y2="80" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" stroke-dasharray="8 4" />
</svg>
